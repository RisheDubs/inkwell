name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Run unit tests with the race detector
        run: go test -race -cover ./...

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -t inkwell-api:ci .

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      MONGO_ROOT_USERNAME: ci
      # compose.yaml requires these; the integration tests don't call Cognito or AWS.
      COGNITO_USER_POOL_ID: ap-southeast-2_ci
      COGNITO_CLIENT_ID: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Generate a throwaway database password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MONGO_ROOT_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start MongoDB and wait until it is healthy
        working-directory: .
        run: docker compose up -d --wait mongodb
      - name: Run integration tests (store + HTTP isolation)
        run: |
          export MONGODB_URI="mongodb://ci:${MONGO_ROOT_PASSWORD}@localhost:27017/?directConnection=true&authSource=admin"
          go test -tags integration -count=1 -v ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    # This job's commands run in the web app, not apps/api (the workflow default).
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13" # same as the host and Dockerfile.dev
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exactly what the lockfile says
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests (run once, no watch mode)
        run: npx vitest run
      - name: Type-check and production build
        run: npm run build
      - name: Fail on high or critical advisories in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    # Static checks only: no AWS credentials, no backend, nothing is created.
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1" # same as the host
          terraform_wrapper: false # plain exit codes and output
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend) and validate every root module
        run: |
          set -euo pipefail
          for dir in bootstrap envs/dev envs/prod/foundation envs/prod/runtime; do
            if compgen -G "$dir/*.tf" > /dev/null; then
              echo "::group::$dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
              echo "::endgroup::"
            else
              echo "skip $dir (no .tf files yet)"
            fi
          done
      - name: Lint with tflint
        run: tflint --recursive --config "$PWD/.tflint.hcl"
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Run unit tests with the race detector
        run: go test -race -cover ./...

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -t inkwell-api:ci .

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      MONGO_ROOT_USERNAME: ci
      # compose.yaml requires these; the integration tests don't call Cognito.
      COGNITO_USER_POOL_ID: ap-southeast-2_ci
      COGNITO_CLIENT_ID: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Generate a throwaway database password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MONGO_ROOT_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start MongoDB and wait until it is healthy
        working-directory: .
        run: docker compose up -d --wait mongodb
      - name: Run integration tests
        run: |
          export MONGODB_URI="mongodb://ci:${MONGO_ROOT_PASSWORD}@localhost:27017/?directConnection=true&authSource=admin"
          go test -tags integration -count=1 -v ./internal/store/...

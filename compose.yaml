name: inkwell

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.3.9
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-search:/data/mongot

  api:
    build:
      context: ./apps/api
    image: inkwell-api:dev
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/?directConnection=true&authSource=admin"
      MONGODB_DATABASE: inkwell
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?set COGNITO_USER_POOL_ID in .env}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?set COGNITO_CLIENT_ID in .env}
      AWS_REGION: ap-southeast-2
      S3_CONTENT_BUCKET: ${S3_CONTENT_BUCKET:-}
      KMS_KEY_ARN: ${KMS_KEY_ARN:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - path: .aws-session.env
        required: false   # the stack still starts without it; entry routes then fail with a clear AWS error
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
  mongo-search: